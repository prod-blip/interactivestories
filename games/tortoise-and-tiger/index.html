<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8bc7b6" />
    <link rel="icon" href="./shared/icons/moonlit-mark.svg" />
    <title>The Tortoise and the Tiger</title>
  </head>
  <body>
    <main id="app" aria-label="The Tortoise and the Tiger game">
      <section id="game-loader" class="loader" role="status" aria-live="polite">
        <img class="loader__mark" src="./shared/icons/moonlit-mark.svg" alt="" />
        <p class="loader__stage">Preparing the story world</p>
        <div class="loader__track" aria-hidden="true"><span class="loader__bar"></span></div>
        <span class="loader__percent">0%</span>
        <button class="loader__retry" type="button">Try again</button>
      </section>
      <section id="story-intro" class="story-intro" aria-live="polite" aria-label="Story title">
        <div class="story-intro__title-card">
          <h1>THE TORTOISE AND THE TIGER</h1>
          <p>A gentle tale of calm thinking and clever courage.</p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
